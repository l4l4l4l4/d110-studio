name: Build and release
on:
  push:
    branches: [main, 'feat/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.41.9'
          cache: true
      - run: flutter pub get
      - run: make check
  linux:
    needs: check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libbluetooth-dev librsvg2-dev libgirepository1.0-dev desktop-file-utils
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.41.9'
          cache: true
      - run: flutter pub get && flutter build linux --release
      - run: bash packaging/appimage.sh
      - name: Smoke extracted AppImage
        run: |
          cd dist
          chmod +x *.AppImage
          ./D110-Studio-1.0.0-linux-x86_64.AppImage --appimage-extract
          xvfb-run -a timeout 8 squashfs-root/AppRun > smoke.log 2>&1 &
          pid=$!
          set +e
          wait "$pid"
          code=$?
          set -e
          cat smoke.log
          test "$code" = 124
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux
          path: dist/*.AppImage
          if-no-files-found: error
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.41.9'
          cache: true
      - name: Restore private release signing key
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          ANDROID_SIGNING: ${{ secrets.ANDROID_SIGNING }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib
          signing = json.loads(os.environ['ANDROID_SIGNING'])
          key = pathlib.Path('android/app/release.jks')
          key.write_bytes(base64.b64decode(signing['keystore']))
          key.chmod(0o600)
          pathlib.Path('android/key.properties').write_text(
              'storeFile=release.jks\nkeyAlias=d110-studio\n'
              'storePassword=' + signing['password'] + '\n'
              'keyPassword=' + signing['password'] + '\n')
          PY
      - name: Build signed Android APK
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: flutter pub get && flutter build apk --release
      - name: Validate fork Android build without private signing
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: flutter pub get && flutter build apk --debug
      - name: Prepare signed APK artifact
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: mkdir -p dist && cp build/app/outputs/flutter-apk/app-release.apk dist/D110-Studio-1.0.0-android.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error
  windows:
    needs: check
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.41.9'
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Bundle Microsoft C++ runtime
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -property installationPath
          $redist = Get-ChildItem "$vs\VC\Redist\MSVC" -Directory | Sort-Object Name -Descending | Where-Object { Test-Path "$($_.FullName)\x64\Microsoft.VC143.CRT" } | Select-Object -First 1
          if (-not $redist) { throw 'Microsoft VC143 runtime directory missing' }
          Copy-Item "$($redist.FullName)\x64\Microsoft.VC143.CRT\*.dll" build/windows/x64/runner/Release/
      - name: Smoke executable
        shell: pwsh
        run: |
          $app = Start-Process build/windows/x64/runner/Release/d110_studio.exe -PassThru
          Start-Sleep -Seconds 8
          if ($app.HasExited) { throw "Application exited during startup: $($app.ExitCode)" }
          Stop-Process -Id $app.Id
      - name: Package EXE installer
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging/windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows
          path: dist/*.exe
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, android, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist
          merge-multiple: true
      - name: Publish verified build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum *.AppImage *.apk *.exe > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" *.AppImage *.apk *.exe SHA256SUMS \
            --title "D110 Studio $GITHUB_REF_NAME" \
            --notes 'Flutter label editor: text, QR, images, positioning/rotation, monochrome preview, threshold, Bayer, Floyd–Steinberg and Sobel. Classic Bluetooth for the verified AiYin-protocol ORICO D110 revision. Includes Linux x86_64 AppImage, persistently signed Android APK and Windows x64 EXE installer. NIIMBOT-protocol D110 revisions are not compatible. Windows installer is unsigned. No firmware modifications.'
